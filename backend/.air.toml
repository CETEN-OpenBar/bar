# Hot reload for the API during development: `go tool air` (or `task dev` from the repo root).
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/bar ./cmd/bar"
  entrypoint = ["./tmp/bar"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "storage", "autogen/helloasso"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  send_interrupt = true
  kill_delay = "1s"
  stop_on_error = false

[log]
  main_only = false

[misc]
  clean_on_exit = true
