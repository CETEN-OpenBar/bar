services:
  backend:
    build:
      dockerfile: Dockerfile
      network: host
      context: backend
    ports:
      - 9999:8080
    env_file:
      - backend/.env
    profiles:
      - "dev"
  frontend:
    build:
      dockerfile: Dockerfile
      network: host
      context: frontend
    volumes:
      - ./frontend/static/config.dev.json:/app/build/client/config.json:ro
    ports:
      - 9998:3000
    profiles:
      - "dev"
      - "frontend"
  mongo:
    # 8.0+ refuses to start on Linux kernel 6.19 and newer (SERVER-121912)
    image: mongo:7.0
    restart: always
    command: mongod --replSet rs0 --bind_ip_all
    ports:
    - 127.0.0.1:27017:27017
    environment:
      MONGO_INITDB_DATABASE: astralys
    healthcheck:
      test: |
        test $$(mongosh --quiet --eval "try { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1' }] }).ok } catch (_) { rs.status().ok }") -eq 1
      interval: 3s
      start_period: 3s
    volumes:
      - ./data:/out
  mongo-express:
    image: mongo-express:1.0.2
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
    # Local development only: no login, so only published on this machine
    ports:
      - 127.0.0.1:8081:8081
    environment:
      # directConnection: the replica set advertises 127.0.0.1, which is this container
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/?directConnection=true
      ME_CONFIG_BASICAUTH: "false"
  oidc:
    # Dev login for /client: type any username on its login page
    image: ghcr.io/navikt/mock-oauth2-server:6.1.2
    restart: always
    ports:
      - 127.0.0.1:8082:8080
    environment:
      JSON_CONFIG: >-
        {"interactiveLogin": true,
         "tokenCallbacks": [{"issuerId": "default",
           "requestMappings": [{"requestParam": "subject", "match": ".*",
             "claims": {"email": "$${subject}@telecomnancy.net",
                        "given_name": "$${subject}",
                        "family_name": "Test"}}]}]}
