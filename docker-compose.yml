services:
  backend:
    build:
      dockerfile: Dockerfile
      network: host
      context: backend
    ports:
      - 9999:8080
    env_file:
      - backend/.env
    profiles:
      - "dev"
  frontend:
    build:
      dockerfile: Dockerfile
      network: host
      context: frontend
    volumes:
      - ./frontend/static/config.dev.json:/app/build/client/config.json:ro
    ports:
      - 9998:3000
    profiles:
      - "dev"
      - "frontend"
  mongo:
    # 8.0+ refuses to start on Linux kernel 6.19 and newer (SERVER-121912)
    image: mongo:7.0
    restart: always
    command: mongod --replSet rs0 --bind_ip_all
    ports:
    - 127.0.0.1:27017:27017
    environment:
      MONGO_INITDB_DATABASE: astralys
    healthcheck:
      test: |
        test $$(mongosh --quiet --eval "try { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1' }] }).ok } catch (_) { rs.status().ok }") -eq 1
      interval: 3s
      start_period: 3s
    volumes:
      - ./data:/out
  mongo-express:
    image: mongo-express:1.0.2
    restart: always
    network_mode: host
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://127.0.0.1:27017/
      # Local development only: no login, and only reachable from this machine
      ME_CONFIG_BASICAUTH: "false"
      VCAP_APP_HOST: 127.0.0.1